name: CI

on:
  push:
    branches: [main, develop, next]
  pull_request:
    branches: [main, develop, next]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 'lts/*'
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Test server-side rendering
        run: npm run test:ssr

      - name: Build demo (SSR and browser bundles)
        run: npm run build

      - name: Install browser test runner
        run: npm install --no-save --package-lock=false playwright@1.65.0

      - name: Install Chromium
        run: npx playwright install --with-deps chromium

      - name: Start production preview
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/vitepress-preview.log 2>&1 &
          for attempt in {1..30}; do
            if curl --fail --silent http://127.0.0.1:4173/ > /dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/vitepress-preview.log
          exit 1

      - name: Browser smoke tests
        run: npm run test:e2e
